name: Update RUC schedule and publish
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: schedule-pages
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official schedule
        id: sync
        continue-on-error: true
        run: python scripts/sync_schedule.py
      - name: Require a usable cache
        run: test -s data/schedule.json
      - name: Save latest successful data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official RUC schedule"
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site/data
          cp index.html app.js _site/
          cp data/schedule.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source outage
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::RUC refresh failed. Published the last successful cache."
          exit 1
