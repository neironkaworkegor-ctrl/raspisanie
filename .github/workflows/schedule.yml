name: Update RUC schedule and publish
on:
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Обновить все 12 недель (дольше обычного)'
        type: boolean
        default: true
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: schedule-pages
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official schedule
        id: sync
        continue-on-error: true
        env:
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full || github.event.schedule == '23 0 * * *' }}
        run: |
          if [ "$FULL_SYNC" = "true" ]; then
            python scripts/sync_schedule.py
          else
            python scripts/sync_schedule.py --past-weeks 0 --future-weeks 1
          fi
      - name: Require a usable cache
        run: test -s data/groups.json && test -d data/years
      - name: Save latest successful data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/groups.json data/schedule.json data/years/
          if ! git diff --cached --quiet; then
            git commit -m "Update official RUC schedule"
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site/data
          cp index.html app.js _site/
          cp data/groups.json data/schedule.json _site/data/
          cp -R data/years _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source outage
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::RUC refresh failed. Published the last successful cache."
          exit 1
          echo "::error::RUC refresh failed. Published the last successful cache."
          exit 1
