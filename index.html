<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Что по парам? · СКИ РУК</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--paper:#f8f5ef;--ink:#21221f;--pink:#e4a1cf;--plum:#a05188;--burst:polygon(50% 0,55% 32%,70% 4%,65% 35%,89% 14%,72% 41%,100% 33%,74% 48%,100% 54%,75% 56%,97% 77%,69% 64%,84% 96%,61% 70%,61% 100%,52% 72%,37% 99%,43% 69%,17% 94%,34% 64%,0 72%,29% 55%,0 47%,29% 46%,4% 23%,35% 38%,20% 2%,44% 32%)}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.4 Arial,sans-serif;overflow-x:clip}
button,input,select,a{font:inherit}button,input,select{color:inherit;background:#2c2d29;border:1px solid #666;border-radius:7px;padding:10px;min-height:44px}button,select{cursor:pointer}button{transition:background .18s,transform .18s}button:hover{background:#393a34}button:active{transform:translateY(1px)}button[aria-pressed=true]{background:var(--pink);color:var(--ink);border-color:var(--pink)}button:disabled{opacity:.35;cursor:default}a{color:var(--pink)}:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
main{position:relative;isolation:isolate;max-width:900px;margin:auto;padding:18px 40px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #777;padding:5px 0 30px;font-size:14px;font-weight:900}header a{font-size:13px;color:var(--paper);text-decoration:none}header sup{font-size:8px;vertical-align:super}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:320px;border-bottom:1px solid #777;padding:40px 10px 28px;display:flex;flex-direction:column;justify-content:space-between}
.hero-star{position:absolute;z-index:-1;width:425px;aspect-ratio:1;right:-55px;top:-75px;display:grid;place-items:center;background:var(--plum);clip-path:var(--burst);transform:rotate(12deg)}.hero-star span{font-size:52px;font-weight:1000;letter-spacing:-.06em;transform:rotate(-12deg);margin:0}
h1{font:1000 italic 104px/.85 "Arial Black",Arial,sans-serif;letter-spacing:-.065em;margin:5px 0 48px;transform:rotate(-3deg);transform-origin:left center;width:max-content;max-width:100%}.hero p{font-weight:900;font-size:16px;margin:0;max-width:90%;overflow-wrap:anywhere}
.group-picker{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 0 12px;margin:0}.group-picker label{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--pink);font-weight:900;font-size:20px;letter-spacing:-.055em;min-width:0}.group-picker select{color:var(--paper);font-size:25px;font-weight:900;letter-spacing:-.06em;text-align:center;text-align-last:center;max-width:100%;padding:6px 16px}.group-picker select option{font-size:16px;letter-spacing:normal}.year-field select{min-width:94px}.group-field{width:100%}.group-field select{width:100%}#preference-status{margin:0;max-width:75%;text-align:center;font-size:11px;color:#c5c5be;line-height:1.3}
.controls{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 18px}.controls>button{font-size:25px;width:44px;padding:5px}.controls label{min-width:0;position:relative}.date-display{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:25px;font-weight:900;letter-spacing:-.055em}.controls input{color:transparent;-webkit-text-fill-color:transparent}.controls input::-webkit-calendar-picker-indicator{opacity:0!important;width:100%!important;position:absolute;inset:0;height:100%;cursor:pointer}.controls input:focus-visible{outline:3px solid var(--pink)}.controls input{font-weight:900;font-size:25px;letter-spacing:-.055em;text-align:center;width:180px;padding:6px 10px}.controls input::-webkit-calendar-picker-indicator{width:16px;opacity:.65;margin:0;padding:0}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}nav button{padding:9px 0;font-size:13px;line-height:1.4}nav b{display:block;font-size:25px;font-weight:900}
#schedule{position:relative;min-height:140px}h2{font-size:34px;font-weight:1000;letter-spacing:-.045em;margin:22px 0 18px;line-height:1.15}article{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 104px;gap:12px;margin:8px 0;background:var(--paper);color:var(--ink);padding:18px 16px;border-radius:4px;min-height:135px}.number{font:bold 36px/1 Arial;color:#794768}.number small{display:block;font:12px/1.4 Arial;margin-top:5px}h3{margin:0 0 6px;font-size:24px;line-height:1.03;letter-spacing:-.035em;font-weight:900}.lesson-content{min-width:0;overflow-wrap:anywhere}.lesson-content>div:not(.info){font-size:15px;line-height:1.4}.info{display:flex;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px;gap:5px}.tag{background:#eed8e7;padding:3px 7px;border-radius:3px}.lesson-time{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-left:2px solid #e5c6dc;color:#794768;font-weight:900;font-size:21px;white-space:nowrap;font-variant-numeric:tabular-nums}.lesson-time span{font-size:10px;font-weight:400}.lesson-time .time-divider{width:22px;height:2px;background:var(--plum)}
.extras{position:relative;margin:25px 0 20px;padding:0 30px;display:flex;justify-content:center;align-items:start;gap:14px;flex-wrap:wrap}.extras button,.extras summary{font-size:12px;color:var(--pink)}.extras details{min-width:140px}.extras summary{cursor:pointer;padding:12px 6px;min-height:44px;text-align:center}.extras input{width:100%;max-width:320px;margin-top:8px;font-size:16px}.extras details[open]{flex-basis:100%;text-align:center}.extras details[open] input{display:block;margin:8px auto}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #777;padding-top:15px;color:#ccc;font-size:11px}footer span{max-width:70%}
.spark{position:absolute;background:var(--plum);clip-path:var(--burst);pointer-events:none;z-index:-1;aspect-ratio:1}.picker-spark-a{width:78px;left:15px;top:25px;transform:rotate(19deg)}.picker-spark-b{width:64px;right:18px;top:33px;transform:rotate(-12deg)}.controls .spark{width:34px;left:6px;top:12px}.extras .spark{width:58px;right:0;top:9px}.side-star{position:fixed;z-index:-2;pointer-events:none;background:var(--plum);clip-path:var(--burst);aspect-ratio:1;width:clamp(110px,18vw,260px);opacity:.8}.side-one{left:max(10px,calc(50% - 690px));top:42%;transform:rotate(17deg)}.side-two{right:max(10px,calc(50% - 710px));top:70%;transform:rotate(-15deg)}
@media(max-width:1100px){.side-star{display:none}}
@media(max-width:600px){main{padding:18px 12px 30px}header{font-size:12px;padding-bottom:30px}header a{font-size:12px}.hero{min-height:239px;padding:39px 10px 26px}.hero-star{width:245px;right:-45px;top:-39px}.hero-star span{font-size:33px;margin:0}h1{font-size:clamp(48px,14vw,73px);letter-spacing:-.055em;line-height:.85;margin:0 0 40px}.hero p{font-size:13px}.group-picker{gap:17px;padding-top:14px}.group-picker label{font-size:20px}.group-picker select{font-size:24px;min-height:46px;padding:6px 12px}.group-picker .group-field select{font-size:clamp(18px,5.6vw,25px);letter-spacing:-.06em}.picker-spark-a{left:8px;top:20px;width:76px}.picker-spark-b{right:12px;top:28px;width:60px}#preference-status{font-size:10px}.controls{gap:10px;margin-top:5px}.controls input{font-size:24px;width:166px}.controls .spark{left:0;width:30px}nav b{font-size:24px}nav button{font-size:12px}h2{font-size:28px;margin-top:24px;margin-bottom:20px}article{grid-template-columns:32px minmax(0,1fr) 72px;gap:8px;padding:16px;min-height:146px}.number{font-size:33px}h3{font-size:21px}.lesson-content>div:not(.info){font-size:12px;line-height:1.4}.info{font-size:11px;gap:3px}.lesson-time{font-size:18px}.lesson-time span{font-size:10px}footer span{max-width:100%}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<span class="side-star side-one" aria-hidden="true"></span><span class="side-star side-two" aria-hidden="true"></span>
<main>
<header><span>СКИ РУК / Саранск</span><a href="https://t.me/hermespunk" target="_blank" rel="noopener">tg: hermespunk<sup>TM</sup></a></header>
<section class="hero"><div class="hero-star" aria-hidden="true"></div><h1>ЧТО ПО<br>ПАРАМ?</h1><p id="group-title">ЮР(ЮР)2-О/Бп/СР25</p></section>
<section class="group-picker" aria-label="Выбор группы">
<span class="spark picker-spark-a" aria-hidden="true"></span><span class="spark picker-spark-b" aria-hidden="true"></span>
<label class="year-field">год набора<select id="year" aria-label="Год набора"><option>Загружаем…</option></select></label>
<label class="group-field">моя группа<select id="group" aria-label="Моя группа"><option>Загружаем…</option></select></label>
<p id="preference-status" role="status">Выбор сохраняется на этом устройстве.</p>
</section>
<div class="controls"><span class="spark" aria-hidden="true"></span><button id="prev" aria-label="Предыдущая неделя">←</button><label><span class="visually-hidden">Дата</span><input id="date" type="date"><span class="date-display" id="date-display" aria-hidden="true"></span></label><button id="next" aria-label="Следующая неделя">→</button></div>
<nav aria-label="Дни недели"></nav>
<section id="schedule" aria-live="polite"><p>Загружаем расписание…</p></section>
<div class="extras"><button id="all" aria-pressed="false">Вся неделя</button><button id="refresh">Обновить ↻</button><details><summary>Найти группу</summary><label class="visually-hidden" for="group-search">Поиск группы</label><input id="group-search" type="search" placeholder="Например, ЮР или ИСП" autocomplete="off"></details><span class="spark" aria-hidden="true"></span></div>
<noscript>Для просмотра расписания включи JavaScript.</noscript>
<footer><span id="source"></span><a href="https://schedule.ruc.su/" target="_blank" rel="noopener">Сверить с РУК ↗</a></footer>
</main>
<script src="app.js?v=2" defer></script>
</body>
</html>
